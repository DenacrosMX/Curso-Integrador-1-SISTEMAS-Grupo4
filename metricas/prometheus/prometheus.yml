global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metricas de la app Java (JMX Exporter)
  - job_name: 'habitech-app'
    static_configs:
      - targets: ['habitech-app:9404']
        labels:
          app: 'habitech'

  # Metricas de PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          app: 'habitech'
          component: 'database'

  # Metricas del propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
